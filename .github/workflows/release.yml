name: Release

on:
  push:
    tags:
      - "*-*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing LSPosed tag to publish, for example 12-0.1.11
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate signing secrets
        env:
          CGE_KEYSTORE_BASE64: ${{ secrets.CGE_KEYSTORE_BASE64 }}
          CGE_KEYSTORE_PASSWORD: ${{ secrets.CGE_KEYSTORE_PASSWORD }}
          CGE_KEY_ALIAS: ${{ secrets.CGE_KEY_ALIAS }}
          CGE_KEY_PASSWORD: ${{ secrets.CGE_KEY_PASSWORD }}
        run: |
          test -n "$CGE_KEYSTORE_BASE64"
          test -n "$CGE_KEYSTORE_PASSWORD"
          test -n "$CGE_KEY_ALIAS"
          test -n "$CGE_KEY_PASSWORD"

      - name: Restore release keystore
        env:
          CGE_KEYSTORE_BASE64: ${{ secrets.CGE_KEYSTORE_BASE64 }}
        run: printf '%s' "$CGE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release
        env:
          CGE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          CGE_KEYSTORE_PASSWORD: ${{ secrets.CGE_KEYSTORE_PASSWORD }}
          CGE_KEY_ALIAS: ${{ secrets.CGE_KEY_ALIAS }}
          CGE_KEY_PASSWORD: ${{ secrets.CGE_KEY_PASSWORD }}
          CGE_EXPECTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: ./scripts/package-apk.sh release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          . dist/release-metadata.env
          test "$REQUESTED_TAG" = "$LSPOSED_TAG"
          if gh release view "$LSPOSED_TAG" >/dev/null 2>&1; then
            gh release upload "$LSPOSED_TAG" \
              "dist/$ARTIFACT_NAME" \
              "dist/$ARTIFACT_NAME.sha256" \
              "dist/SHA256SUMS" \
              --clobber
          else
            gh release create "$LSPOSED_TAG" \
              "dist/$ARTIFACT_NAME" \
              "dist/$ARTIFACT_NAME.sha256" \
              "dist/SHA256SUMS" \
              --title "$VERSION_NAME" \
              --generate-notes
          fi

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ColorOS-Negative-Screen-Extension-release
          path: |
            dist/*.apk
            dist/*.sha256
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
