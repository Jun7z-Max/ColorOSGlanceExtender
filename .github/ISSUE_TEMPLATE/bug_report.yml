name: Bug report
description: 报告兼容性或运行问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        请勿上传未脱敏的完整应用列表、账号信息、设备序列号或签名文件。

  - type: input
    id: module_version
    attributes:
      label: 模块版本
      placeholder: 0.1.11 / versionCode 12
    validations:
      required: true

  - type: input
    id: system_version
    attributes:
      label: Android 与 ColorOS 版本
      placeholder: Android 16, ColorOS ...
    validations:
      required: true

  - type: input
    id: component_versions
    attributes:
      label: 速览与智慧建议服务版本
      placeholder: com.coloros.assistantscreen ...; com.oplus.pantanal.ums ...
    validations:
      required: true

  - type: input
    id: lsposed_version
    attributes:
      label: LSPosed 实现与版本
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际结果、预期结果和是否可稳定复现
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 脱敏日志
      description: 建议使用 adb logcat -s ColorOSGlanceExtender
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 已勾选速览与智慧建议服务两个作用域
          required: true
        - label: 已重载两个作用域进程或重启手机
          required: true
        - label: 日志和截图已经脱敏
          required: true
